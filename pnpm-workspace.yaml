packages:
  - 'website'
  - 'packages/apps/*'
  - 'packages/domains/*'
  - 'packages/shared/*'

# Install only package versions published at least 30 days ago (minutes), the same age
# Renovate waits before proposing an update. A hand bump that needs a newer version goes
# in minimumReleaseAgeExclude below, with the reason and the date it clears the gate.
minimumReleaseAge: 43200
# Exempt: TypeScript and React are always used at their latest versions.
minimumReleaseAgeExclude:
  - typescript
  - '@typescript/typescript-*'
  - react
  - react-dom
  - scheduler
  # Renovate security update: picomatch@4.0.4
  - picomatch@4.0.4
  # Renovate security update: pnpm@10.34.5
  - pnpm@10.34.5
  # Renovate security update: astro@7.3.2
  - astro@7.3.2
  # Renovate security update: diff@8.0.3
  - diff@8.0.3
  # Already locked since the knip 6 bump (08443aab4); vite 8's shared picomatch/oxc
  # deps re-resolve knip's subtree, which re-checks it. Drop once it clears the age
  # gate (2026-10-30).
  - unbash@4.0.12
  # Hand bump (2026-10-25): v45 features needed now; also fixes the eMudhra cert
  # advisory 44.5.1 is exposed to. Tarball checksums.json verified against the GitHub
  # release SHASUMS256.txt. Drop once 45.0.0 clears the age gate (2026-11-20).
  - electron@45.0.0
  # Hand bump (2026-10-27): 5.0.0's ESM shim finds the last import by regex and
  # js-yaml 5's JSDoc `import … from 'js-yaml'` put the __dirname/require shim inside a
  # comment → main crashed at boot. 6.0.0 parses the AST. Drop once 6.0.0 clears the
  # age gate (2026-11-13).
  - electron-vite@6.0.0

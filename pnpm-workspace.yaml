packages:
  - 'website'
  - 'packages/apps/*'
  - 'packages/domains/*'
  - 'packages/shared/*'

# Install only package versions published at least 30 days ago (minutes).
minimumReleaseAge: 43200
# Exempt: TypeScript is always used at its latest version.
minimumReleaseAgeExclude:
  - typescript
  - '@typescript/typescript-*'
  # Renovate security update: picomatch@4.0.4
  - picomatch@4.0.4
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: pnpm@10.34.5
  - pnpm@10.34.5
  # Renovate security update: astro@7.3.2
  - astro@7.3.2
  # Renovate security update: diff@8.0.3
  - diff@8.0.3

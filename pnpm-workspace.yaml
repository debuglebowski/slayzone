packages:
  - 'website'
  - 'packages/apps/*'
  - 'packages/domains/*'
  - 'packages/shared/*'

# Install only package versions published at least 30 days ago (minutes).
minimumReleaseAge: 43200
# Exempt: TypeScript and React are always used at their latest versions.
minimumReleaseAgeExclude:
  - typescript
  - '@typescript/typescript-*'
  - react
  - react-dom
  - scheduler

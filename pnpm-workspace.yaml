  - expo-image-picker@58.0.10 # 2026-10-31

# Electron's ABI and electron-builder need a flat node_modules (no symlinked tree).
nodeLinker: hoisted
publicHoistPattern:
  - vite

# Only `true` entries may run install scripts; one not listed fails the install
# (strictDepBuilds). The `false` ones never ran them before pnpm 11 either:
# bufferutil is rebuilt for Electron by scripts/postinstall.js, the rest need none.
# @parcel/watcher and unrs-resolver (jest 30, the mobile app's tests) load their
# prebuilt per-platform optional package; their scripts only build from source or
# fetch one when it is missing.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  node-pty: true
  posix: true
  '@parcel/watcher': false
  '@swc/core': false
  bufferutil: false
  core-js: false
  electron-winstaller: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false

overrides:
  'zod': '^4.5.4'
  'd3-shape>d3-path': '^3.1.0'
  'node-abi': '^4.35.0'
  'posix>nan': '^2.29.0'
  'electron-chrome-web-store>adm-zip': '^0.6.1'
  'prosemirror-view': '^1.42.3'
  'prosemirror-model': '^1.25.12'

# expo-router depends on react-native-drawer-layout for `expo-router/drawer` only, which
# the mobile app does not use. Its required peers (react-native-reanimated,
# react-native-gesture-handler) would otherwise be auto-installed at whatever mature
# version resolves, not the ones Expo SDK 58 pins, and autolinked into the iOS build as
# native modules nothing calls (reanimated also pulls react-native-worklets, whose
# required @react-native/metro-config peer resolves to 0.87.1 against React Native
# 0.88.1). Optional here; a phase that uses gestures adds them at the SDK's versions.
packageExtensions:
  react-native-drawer-layout:
    peerDependenciesMeta:
      react-native-gesture-handler:
        optional: true
      react-native-reanimated:
        optional: true

patchedDependencies:
  '@convex-dev/auth@0.0.95': patches/@convex-dev__auth@0.0.95.patch
  'posix@4.2.0': patches/posix@4.2.0.patch
  '@radix-ui/react-menu@2.1.24': patches/@radix-ui__react-menu@2.1.24.patch
  'electron-chrome-extensions@4.9.0': patches/electron-chrome-extensions@4.9.0.patch
  'node-pty@1.1.0': patches/node-pty@1.1.0.patch

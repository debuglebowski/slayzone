<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Chart Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 1.5rem; }
  h1 { margin: 0 0 1rem; }
  .controls { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: 0.5rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
  button:hover { background: #334155; }
  button.active { background: #3b82f6; border-color: #3b82f6; }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; }
  .grid > div { background: #1e293b; padding: 1rem; border-radius: 12px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
  .row2 > div { background: #1e293b; padding: 1rem; border-radius: 12px; }
  canvas { max-height: 320px; }
  .live-dot { display: inline-block; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: pulse 1s infinite; vertical-align: middle; margin-right: 0.4rem; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
<h1>Live Metrics Dashboard</h1>
<div class="controls">
  <button id="play" class="active"><span class="live-dot"></span>Pause stream</button>
  <button data-range="60">1m</button>
  <button data-range="300" class="active">5m</button>
  <button data-range="900">15m</button>
  <button id="reset">Clear</button>
  <span style="margin-left:auto;color:#94a3b8">Tick rate: 1Hz</span>
</div>
<div class="grid">
  <div><h3>CPU usage (live)</h3><canvas id="line"></canvas></div>
  <div><h3>Region share</h3><canvas id="pie"></canvas></div>
</div>
<div class="row2">
  <div><h3>Requests/min by endpoint</h3><canvas id="bar"></canvas></div>
  <div><h3>Latency vs Throughput</h3><canvas id="scatter"></canvas></div>
</div>
<script>
Chart.defaults.color = '#94a3b8';
Chart.defaults.borderColor = '#334155';

const lineData = { labels: [], datasets: [
  { label: 'web-1', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.15)', tension: 0.35, fill: true },
  { label: 'web-2', data: [], borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.15)', tension: 0.35, fill: true },
  { label: 'web-3', data: [], borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.15)', tension: 0.35, fill: true },
]};
const lineChart = new Chart(document.getElementById('line'), {
  type: 'line', data: lineData,
  options: { animation: false, scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } }, plugins: { legend: { position: 'bottom' } } }
});

const pieChart = new Chart(document.getElementById('pie'), {
  type: 'doughnut',
  data: { labels: ['us-east', 'us-west', 'eu-central', 'ap-south'], datasets: [{ data: [42, 23, 21, 14], backgroundColor: ['#3b82f6','#10b981','#f59e0b','#ef4444'] }] },
  options: { plugins: { legend: { position: 'bottom' } } }
});

const barChart = new Chart(document.getElementById('bar'), {
  type: 'bar',
  data: { labels: ['/api/users','/api/orders','/api/auth','/api/search','/api/health'], datasets: [{ label: 'rpm', data: [320, 180, 410, 96, 1240], backgroundColor: '#6366f1' }] },
  options: { indexAxis: 'y', plugins: { legend: { display: false } } }
});

const scatterChart = new Chart(document.getElementById('scatter'), {
  type: 'scatter',
  data: { datasets: [{ label: 'samples', data: Array.from({length:60}, () => ({ x: Math.random()*1000, y: 20 + Math.random()*180 })), backgroundColor: '#a855f7' }] },
  options: { scales: { x: { title: { display: true, text: 'Throughput (req/s)' } }, y: { title: { display: true, text: 'P95 latency (ms)' } } } }
});

let running = true, windowSec = 300;
function tick() {
  const now = new Date();
  const label = now.toLocaleTimeString();
  if (lineData.labels.length >= windowSec) { lineData.labels.shift(); lineData.datasets.forEach(ds => ds.data.shift()); }
  lineData.labels.push(label);
  lineData.datasets.forEach((ds, i) => {
    const last = ds.data[ds.data.length - 1] ?? 30 + i * 10;
    const next = Math.max(2, Math.min(98, last + (Math.random() - 0.5) * 14));
    ds.data.push(+next.toFixed(1));
  });
  lineChart.update('none');

  if (Math.random() < 0.3) {
    barChart.data.datasets[0].data = barChart.data.datasets[0].data.map(v => Math.max(20, v + (Math.random() - 0.5) * 80 | 0));
    barChart.update('none');
  }
  if (Math.random() < 0.2) {
    const ds = scatterChart.data.datasets[0].data;
    if (ds.length > 80) ds.shift();
    ds.push({ x: Math.random()*1000, y: 20 + Math.random()*180 });
    scatterChart.update('none');
  }
}
let timer = setInterval(() => { if (running) tick(); }, 1000);

document.getElementById('play').onclick = (e) => {
  running = !running;
  e.currentTarget.innerHTML = running ? '<span class="live-dot"></span>Pause stream' : '▶ Resume';
  e.currentTarget.classList.toggle('active', running);
};
document.querySelectorAll('button[data-range]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('button[data-range]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    windowSec = +btn.dataset.range;
    while (lineData.labels.length > windowSec) { lineData.labels.shift(); lineData.datasets.forEach(ds => ds.data.shift()); }
    lineChart.update();
  };
});
document.getElementById('reset').onclick = () => {
  lineData.labels = []; lineData.datasets.forEach(ds => ds.data = []); lineChart.update();
};
for (let i = 0; i < 30; i++) tick();
</script>
</body>
</html>

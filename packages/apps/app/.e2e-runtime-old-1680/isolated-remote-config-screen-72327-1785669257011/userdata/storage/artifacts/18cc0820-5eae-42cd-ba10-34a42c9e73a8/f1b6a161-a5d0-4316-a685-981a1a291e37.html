<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Profile Form</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 640px; margin: 2rem auto; padding: 2rem; background: #f8fafc; }
  form { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
  fieldset { border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
  legend { padding: 0 0.5rem; font-weight: 600; color: #0f172a; }
  label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.9rem; color: #475569; }
  input[type=text], input[type=email], input[type=tel], select, textarea {
    width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid #3b82f6; outline-offset: 1px; }
  .row { display: flex; gap: 1rem; }
  .row > div { flex: 1; }
  .checkbox-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-top: 0.5rem; }
  .checkbox-group label { display: flex; align-items: center; gap: 0.5rem; margin: 0; font-size: 0.95rem; }
  button { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  button:hover { background: #2563eb; }
  .hint { font-size: 0.8rem; color: #64748b; margin-top: 0.25rem; }
</style>
</head>
<body>
<form>
  <h2>Create Account</h2>
  <fieldset>
    <legend>Identity</legend>
    <div class="row">
      <div><label for="fn">First name</label><input id="fn" type="text" required></div>
      <div><label for="ln">Last name</label><input id="ln" type="text" required></div>
    </div>
    <label for="em">Email</label>
    <input id="em" type="email" placeholder="you@example.com" required>
    <label for="ph">Phone</label>
    <input id="ph" type="tel" pattern="[0-9+\- ]+">
    <p class="hint">International format preferred.</p>
  </fieldset>
  <fieldset>
    <legend>Preferences</legend>
    <label for="role">Role</label>
    <select id="role">
      <option>Engineer</option><option>Designer</option><option>Product Manager</option><option>Other</option>
    </select>
    <label>Notifications</label>
    <div class="checkbox-group">
      <label><input type="checkbox" checked> Product updates</label>
      <label><input type="checkbox"> Marketing</label>
      <label><input type="checkbox" checked> Security alerts</label>
      <label><input type="checkbox"> Newsletter</label>
    </div>
  </fieldset>
  <fieldset>
    <legend>Bio</legend>
    <textarea rows="4" placeholder="Tell us about yourself..."></textarea>
  </fieldset>
  <button type="submit">Create account</button>
</form>
</body>
</html>

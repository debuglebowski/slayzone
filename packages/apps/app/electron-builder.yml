appId: com.slayzone.app
productName: SlayZone
directories:
  buildResources: build
# An ALLOWLIST: the app is its electron-vite output plus the files main reads by path.
# A denylist shipped whatever happened to sit in this directory (e2e specs and runtime
# dirs, test-results, bundle-report.html, tsbuildinfo). package.json and the production
# node_modules (= `dependencies`: main/preload's runtime externals plus the natives the
# hub/computer bundles load through NODE_PATH) are added by electron-builder itself.
# Everything else, @slayzone/* included, is a devDependency bundled into out/.
# scripts/release/smoke-packaged-app.mjs fails the release when the asar's
# node_modules grows past its budget.
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  # main's `?asset` imports of these resolve to app-root/resources (unpacked below).
  - resources/**
asarUnpack:
  - resources/**
  - '**/node_modules/better-sqlite3/**'
  # better-sqlite3's own runtime dependencies. The hub is a bundle in Resources/hub that
  # resolves natives through NODE_PATH=app.asar.unpacked/node_modules (index.ts), and a
  # module required from an unpacked file only looks in unpacked dirs — so a dependency
  # left inside app.asar is invisible: `require('better-sqlite3')` succeeds and the first
  # `new Database()` dies with "Could not locate the bindings file". Keep this list equal
  # to better-sqlite3's `dependencies`; scripts/release/smoke-packaged-app.mjs opens a
  # database from the build output and fails the release if one is missing.
  - '**/node_modules/bindings/**'
  - '**/node_modules/file-uri-to-path/**'
  - '**/node_modules/node-pty/**'
  # Same rule for ws's native accelerator: bufferutil (unpacked as a native) loads its
  # .node through node-gyp-build, its one dependency. Left in app.asar, the require fails
  # and bufferutil silently runs its JS fallback in the hub and computer (smoke step 2).
  - '**/node_modules/bufferutil/**'
  - '**/node_modules/node-gyp-build/**'
win:
  executableName: slayzone
nsis:
  artifactName: ${productName}-setup-${arch}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
afterPack: build/afterPack.cjs
mac:
  artifactName: ${productName}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSDesktopFolderUsageDescription: Application requests access to the user's Desktop folder.
    - NSRemovableVolumesUsageDescription: Application requests access to removable volumes.
    - NSNetworkVolumesUsageDescription: Application requests access to network volumes.
  notarize: true
dmg:
  artifactName: ${productName}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  executableName: slayzone
  maintainer: slayzone
  category: Utility
deb:
  artifactName: ${productName}-${arch}.${ext}
appImage:
  artifactName: ${productName}-${arch}.${ext}
extraResources:
  - from: "../cli/dist/slay.js"
    to: "bin/slay.js"
  - from: "../cli/bin/slay"
    to: "bin/slay"
  - from: "../hub/dist/bin.cjs"
    to: "hub/bin.cjs"
  # The co-located local computer: index.ts spawns resourcesPath/computer/bin.cjs. Every
  # agent, terminal and git operation runs on a computer, so without this the app boots
  # but can do none of its work. Built by the app's `prebuild`.
  - from: "../computer/dist/bin.cjs"
    to: "computer/bin.cjs"
  # server.ts's WEB_ROOT resolves as `join(__dirname, '..', 'dist', 'web')`
  # relative to wherever bin.cjs itself runs from — an OFFSET, not a fixed
  # path, so it resolves correctly both unpackaged (dist/bin.cjs + dist/web
  # side by side under packages/apps/hub/) and here. bin.cjs lands at
  # resourcesPath/hub/bin.cjs, so __dirname there is resourcesPath/hub — the
  # SAME offset from resourcesPath/hub then requires this bundle at
  # resourcesPath/dist/web, not resourcesPath/hub/web.
  - from: "../hub/dist/web"
    to: "dist/web"
npmRebuild: true
nativeRebuilder: sequential
publish:
  provider: github
